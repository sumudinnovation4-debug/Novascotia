<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Studio Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
    <nav class="navbar">...</nav>

    <main>
        <section class="page-hero">
            <div class="container">
                <h1>Let's work together</h1>
                <p>Reach out for new projects, collaborations or press inquiries.</p>
            </div>
        </section>

        <section class="contact-section container">
            <div class="contact-grid">
                <div class="contact-form">
                    <h2>Send a message</h2>
                    <form id="contactForm">
                        <input type="text" id="contactName" placeholder="Full name" required>
                        <input type="email" id="contactEmail" placeholder="Email address" required>
                        <input type="tel" id="contactPhone" placeholder="Phone (optional)">
                        <textarea id="contactMessage" rows="5" placeholder="Tell us about your project..." required></textarea>
                        <button type="submit" class="btn-primary">Submit inquiry</button>
                    </form>
                    <div id="formFeedback" style="margin-top: 1rem;"></div>
                </div>
                <div class="contact-info">
                    <h3>Studio Nova</h3>
                    <p><i class="fas fa-map-marker-alt"></i> 410 W 13th St, New York, NY</p>
                    <p><i class="fas fa-phone"></i> +1 (212) 555-0987</p>
                    <p><i class="fas fa-envelope"></i> hello@studionova.com</p>
                </div>
            </div>
        </section>

        <section class="recent-messages container">
            <h3>Recent inquiries (preview)</h3>
            <div id="messagePreviewList"></div>
            <p><a href="admin.html">Manage all messages →</a></p>
        </section>
    </main>

    <footer>...</footer>
    <script src="js/main.js"></script>
    <script>
        // Contact form handler + preview
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('contactName').value;
            const email = document.getElementById('contactEmail').value;
            const phone = document.getElementById('contactPhone').value;
            const message = document.getElementById('contactMessage').value;

            const messages = JSON.parse(localStorage.getItem('studioNovaMessages')) || [];
            const newMsg = {
                id: Date.now(),
                name, email, phone, message,
                date: new Date().toLocaleString(),
                read: false
            };
            messages.push(newMsg);
            localStorage.setItem('studioNovaMessages', JSON.stringify(messages));
            document.getElementById('formFeedback').innerHTML = '<p style="color: #C8A86A;">✓ Message sent. We’ll respond within 48h.</p>';
            this.reset();
            loadMessagePreview();
        });

        function loadMessagePreview() {
            const messages = JSON.parse(localStorage.getItem('studioNovaMessages')) || [];
            const previewDiv = document.getElementById('messagePreviewList');
            if (messages.length === 0) {
                previewDiv.innerHTML = '<p>No messages yet.</p>';
                return;
            }
            const lastThree = messages.slice(-3).reverse();
            previewDiv.innerHTML = lastThree.map(msg => `<div class="preview-item"><strong>${msg.name}</strong> – ${msg.message.substring(0, 60)}...</div>`).join('');
        }
        loadMessagePreview();
    </script>
</body>
</html>
